    <rect x="56" y="223" width="250" height="145" rx="18" fill="#18181B" stroke="#3F3F46"/>
    <rect x="358" y="223" width="284" height="145" rx="18" fill="#18181B" stroke="#3F3F46"/>
    <rect x="690" y="223" width="254" height="145" rx="18" fill="#18181B" stroke="#71717A" stroke-opacity=".6"/>
    <text x="80" y="262" fill="#A1A1AA" font-size="14">01 / PREDICT</text>
